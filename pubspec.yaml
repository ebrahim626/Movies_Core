name: movies_core
description: "A new Flutter project."


version: 1.0.0+1


environment:
  sdk: ^3.12.2


dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  go_router: ^18.0.1
  flutter_riverpod: ^3.4.3
  flutter_easyloading: ^4.0.2
  flutter_spinkit: ^5.2.2
  hive_ce: ^2.20.1
  hive_ce_flutter: ^2.4.0
  path_provider: ^2.1.6
  pretty_dio_logger: ^1.4.0
  dio: ^5.11.1
  intl: ^0.20.2
  connectivity_plus: ^7.3.1
  dio_cookie_manager: ^3.5.0
  cookie_jar: ^4.0.9
  http: ^1.6.0
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/movies_core_icon.png"
  adaptive_icon_background: "#1E293B" # Your dark navy color
  adaptive_icon_foreground: "assets/images/movies_core_transparent_icon.png" # Only the logo, no background
  min_sdk_android: 21


  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/svgs/
    - assets/images/
    - .env


